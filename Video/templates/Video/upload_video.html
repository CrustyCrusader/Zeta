{% extends "base.html" %}

{% block content %}

<div class="container py-4">

```
<h1 class="mb-4">
    {% if object %}
        Edit Video
    {% else %}
        Upload Video
    {% endif %}
</h1>

<form method="post" enctype="multipart/form-data">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">
        {% if object %}
            Save Changes
        {% else %}
            Upload Video
        {% endif %}
    </button>

    <a
        href="{% url 'Video:video_list' %}"
        class="btn btn-secondary"
    >
        Cancel
    </a>

</form>
```

</div>

{% endblock %}
