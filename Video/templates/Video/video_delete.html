{% extends 'base.html' %}

{% block content %}
<section class="listing-editor">
    <p class="home-eyebrow">REMOVE VIDEO</p>
    <h1>Delete “{{ object.title }}”?</h1>
    <p>This video will be removed from your library.</p>
    <form action="." method="post" class="listing-form listing-delete-form">
        {% csrf_token %}
        <button type="submit" class="market-delete-button">Delete video</button>
        <a href="{% url 'Video:video_details' object.id %}">Keep video</a>
    </form>
</section>
{% endblock %}
