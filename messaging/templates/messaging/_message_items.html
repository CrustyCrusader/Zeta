{% for message in messages %}
    <div class="chat-message {% if message.sender == request.user %}mine{% endif %}" data-message-id="{{ message.id }}">
        <span class="chat-message-author">{{ message.sender.username }}</span>
        <p class="chat-message-content">{{ message.content }}</p>
        <span class="chat-message-time">{{ message.created|date:"M d, H:i" }}</span>
    </div>
{% endfor %}
