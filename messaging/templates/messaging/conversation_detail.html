{% extends "base.html" %}

{% block content %}

<div
    class="chat-page"
    data-conversation-id="{{ conversation.id }}"
    data-current-username="{{ request.user.username }}"
>

    <div class="chat-header">
        <a href="{% url 'messaging:conversation_list' %}" class="back-link">← Messages</a>
        <h1>{{ display_name }}</h1>
    </div>

    <p class="chat-status" id="chat-status" role="status" aria-live="polite">Connecting to chat…</p>

    <div class="chat-messages" id="chat-messages">
        {% for message in messages %}
            <div class="chat-message {% if message.sender == request.user %}mine{% endif %}" data-message-id="{{ message.id }}">
                <span class="chat-message-author">{{ message.sender.username }}</span>
                <p class="chat-message-content">{{ message.content }}</p>
                <span class="chat-message-time">{{ message.created|date:"M d, H:i" }}</span>
            </div>
        {% endfor %}
    </div>

    {% if has_more %}
        <button
            type="button"
            id="load-earlier-btn"
            class="pagination-btn"
            data-url="{% url 'messaging:load_earlier' conversation.id %}"
            data-before-id="{{ messages.0.id|default:'' }}"
        >
        Load earlier messages
        </button>
    {% endif %}


    <form id="chat-form" class="chat-form">
        <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off">
        <button type="submit" class="btn btn-primary">Send</button>
    </form>

</div>

{% endblock %}
