{% extends 'base.html' %}

{% block content %}
<main class="listing-editor">
    <p class="store-kicker">REMOVE OFFERING</p>
    <h1>Remove “{{ object.title }}”?</h1>
    <p>This listing will no longer appear in the market.</p>
    <form method="post" class="listing-form listing-delete-form">
        {% csrf_token %}
        <button type="submit" class="market-delete-button">Remove listing</button>
        <a href="{{ object.get_absolute_url }}">Keep listing</a>
    </form>
</main>
{% endblock %}
