<div class="search-bar" role="search">
    <form method="get" action="{% url 'user_search' %}">
        <label class="visually-hidden" for="site-search">Search people</label>
        <input
            type="text"
            name="q"
            id="site-search"
            placeholder="Find people..."
            value="{{ request.GET.q }}"
        >
        <button type="submit" aria-label="Search people"><span aria-hidden="true">⌕</span></button>
    </form>
</div>
